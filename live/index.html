<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazenda da Live — Lida no Sertão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Rye&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0704;overflow:hidden;font-family:'Bree Serif',Georgia,serif}
#tela{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:9/16;max-width:100vw;height:100vh}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
#sim{position:fixed;right:8px;top:8px;width:300px;max-height:96vh;overflow:auto;background:rgba(30,18,10,.94);color:#fbe9c2;border:3px solid #110905;border-radius:8px;padding:10px;font-size:13px;display:none;z-index:9}
#sim.on{display:block}#sim h3{margin:4px 0 8px;font-family:Rye,serif;color:#f4d58a;font-weight:400}
#sim button{margin:3px 2px;padding:6px 8px;border:2px solid #110905;border-radius:5px;background:linear-gradient(#f0a84a,#c97a24);color:#2b1608;font-weight:700;cursor:pointer;font-family:inherit}
#sim input{width:96%;padding:5px;margin:3px 0;border-radius:4px;border:2px solid #110905;font-family:inherit}
#sim .mut{opacity:.7;font-size:12px}
#st{position:fixed;left:8px;bottom:8px;color:#fbe9c2;font:12px sans-serif;opacity:.55;z-index:8}
#comecar{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.6);color:#fbe9c2;z-index:10;cursor:pointer;text-align:center;font-size:22px}
#comecar b{font-family:Rye,serif;font-weight:400;font-size:40px;color:#f4d58a}
</style>
</head>
<body>
<div id="tela"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div id="comecar"><b>FAZENDA DA LIVE</b><p>Clique para começar (liga o som)</p><p style="font-size:15px;opacity:.75">Tecla <b style="font-family:inherit;font-size:15px">S</b> abre o simulador · teclas 1 a 0 disparam eventos</p></div>
<div id="sim"><h3>Simulador da live</h3>
  <div class="mut">Teste tudo sem estar ao vivo. Tecla S esconde.</div>
  <input id="simNome" value="Zé do Gado" placeholder="nome do espectador">
  <input id="simTxt" value="boi" placeholder="comentário (ex.: boi, chuva, aboio)"><button id="simCom">💬 Comentar</button>
  <div><b>Presentes</b><br><button data-g="1">🌹 Rosa (1)</button><button data-g="5">🎩 5 💎</button><button data-g="30">🍩 30 💎</button><button data-g="100">🦁 100 💎</button><button data-g="500">🌌 500 💎</button></div>
  <div><b>Outros</b><br><button data-o="like">❤️ 100 curtidas</button><button data-o="follow">➕ Seguir</button><button data-o="share">🔁 Compartilhar</button><button data-o="join">👋 Entrar</button></div>
  <div><b>Eventos</b><br><button data-a="festa">🎉 Festa</button><button data-a="corrida">🫏 Corrida</button><button data-a="chuva">🌧 Chuva</button><button data-a="noite">🌙 Pular hora</button></div>
  <div><b>Automático</b><br><button id="simDemo">▶️ Demonstração</button><button id="simZera">🗑 Zerar fazenda</button></div>
  <div class="mut" id="simInfo"></div>
</div>
<div id="st"></div>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const C = window.LIVE_CONFIG || {};
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const K = 4, LW = 270, LH = 480, FW = 1080, FH = 1920, SZ = 1.6; // SZ: tamanho dos bichos e do vaqueiro
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)], cl = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixC = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };

// ---------- estado ----------
const PAST = { x0: 22, x1: 248, y0: 192, y1: 388 }, GATE = { x: 214, y: 192 }, FOGO = { x: 132, y: 300 }, ACUDE = { x: 206, y: 348, rx: 30, ry: 13 };
const W = { t: 0, day: 0.32, grass: 0.55, rain: 0, rainT: 0, flash: 0, festa: 0, forro: 0, fogo: 0, rainbow: 0, likes: 0, likeGoal: C.curtidasParaFesta || 1500,
  animals: [], parts: [], banners: [], feed: [], rank: {}, cool: {}, votos: [], queue: [], big: null, corridaT: 0, truck: null, bull: null, vaq: null, corr: null, nid: 1, live: { conectado: false, usuario: '' }, demo: false };
const VQ = { x: 120, y: 320, tx: 120, ty: 320, dir: 1, act: null, actT: 0, horse: false, say: '', sayT: 0, wt: 0 };
// ---------- som (WebAudio, tudo sintetizado) ----------
const AU = { ctx: null, vol: C.volume === undefined ? 0.6 : C.volume,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.out = this.ctx.createGain(); this.out.gain.value = this.vol; this.out.connect(this.ctx.destination); } catch (e) { } },
  tone(f0, f1, dur, type, vol, when) { if (!this.ctx) return; const t = this.ctx.currentTime + (when || 0), o = this.ctx.createOscillator(), gn = this.ctx.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.03); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(gn); gn.connect(this.out); o.start(t); o.stop(t + dur + 0.05); },

  moo() { this.tone(160, 110, 0.9, 'sawtooth', 0.12); this.tone(165, 105, 0.9, 'triangle', 0.1); },

  coin() { this.tone(988, 1318, 0.12, 'square', 0.08); this.tone(1318, 1760, 0.18, 'square', 0.08, 0.1); },
  boom() { this.noise(0.6, 0.35, 500); this.tone(90, 40, 0.5, 'sine', 0.3); },
  pop() { this.noise(0.15, 0.15, 3000); this.tone(1400, 600, 0.12, 'triangle', 0.08); },
  horn() { this.tone(330, 320, 0.35, 'square', 0.1); this.tone(330, 320, 0.45, 'square', 0.1, 0.45); },
  cheer() { this.noise(1.6, 0.18, 2200); for (let i = 0; i < 6; i++) this.tone(600 + Math.random() * 500, 500, 0.15, 'triangle', 0.04, i * 0.13); },
  hee() { this.tone(900, 500, 0.25, 'sawtooth', 0.08); this.tone(500, 850, 0.3, 'sawtooth', 0.08, 0.25); },

};
// ---------- nomes ----------
function limpa(n) { n = String(n || 'Alguém').replace(/[\u0000-\u001f<>]/g, '').trim(); for (const b of C.bloqueadas || []) n = n.replace(new RegExp(b, 'gi'), '***'); return n.length > 14 ? n.slice(0, 13) + '…' : n || 'Alguém'; }
function pontos(ev, v) { const k = ev.user || ev.nome; if (!k) return; const r = W.rank[k] || (W.rank[k] = { n: limpa(ev.nome || ev.user), p: 0 }); r.n = limpa(ev.nome || ev.user); r.p += v; }
function feed(t) { W.feed.unshift({ t, a: 1, born: performance.now() }); if (W.feed.length > 5) W.feed.length = 5; }
function banner(t, sub, cor, dur) { W.banners.push({ t, sub: sub || '', c: cor || '#ffe08a', life: dur || 3.6, t0: dur || 3.6 }); if (W.banners.length > 3) W.banners.shift(); }
// ---------- animais ----------
const BREEDS = { boi: [['Nelore', '#efe9de', '#b8b0a2'], ['Gir', '#b8542c', '#8a3a1c'], ['Guzerá', '#9a9690', '#6a6660'], ['Holandesa', '#f4f2ee', '#1e1e22', 1], ['Caracu', '#c9862e', '#94601c'], ['Preto', '#2e2a28', '#1a1816']],
  cavalo: [['Alazão', '#a8562a', '#6e3216'], ['Tordilho', '#cfcfd2', '#8a8a92'], ['Preto', '#2a2422', '#141010'], ['Baio', '#d2a868', '#8a6634']], jegue: [['Jegue', '#8a7e70', '#5a5046']], cao: [['Caramelo', '#c88a3a', '#8a5a1e'], ['Preto', '#2a2624', '#141210']], galinha: [['Galinha', '#f2ece0', '#c83a2a'], ['Galinha', '#b8642a', '#c83a2a']] };
function addAnimal(k, nome, o) {
  o = o || {}; const sp = k === 'vaca' || k === 'bezerro' ? 'boi' : k, br = pick(BREEDS[sp] || BREEDS.boi);
  if (W.animals.filter(a => !a.bull).length >= (C.maxAnimais || 45)) { const old = W.animals.find(a => !a.bull && !a.keep); if (old) { old.leave = 1; feed('🚚 ' + old.name + ' foi pra feira'); } }
  const a = { id: W.nid++, sp, k, name: limpa(nome), br, x: o.x !== undefined ? o.x : rnd(PAST.x0 + 10, PAST.x1 - 10), y: o.y !== undefined ? o.y : rnd(PAST.y0 + 14, PAST.y1 - 8), tx: 0, ty: 0, st: 'idle', t: rnd(0, 2), dir: Math.random() < 0.5 ? -1 : 1, fr: 0, small: k === 'bezerro' ? 1 : 0, grow: 0, born: performance.now(), mv: 0, fem: k === 'vaca' };
  a.tx = a.x; a.ty = a.y; W.animals.push(a); return a;
}
function spawnFx(x, y, kind, n) { for (let i = 0; i < (n || 8); i++) W.parts.push({ x, y, vx: rnd(-25, 25), vy: rnd(-45, -10), life: rnd(0.8, 1.6), k: kind, c: kind === 'heart' ? '#ff5a7a' : kind === 'star' ? '#ffe08a' : kind === 'dust' ? '#c8a878' : pick(['#e03030', '#30a040', '#2050c0', '#f0d020', '#ffffff', '#ff7ab0']) }); }
// ---------- ações ----------
const ACOES = {
  boi: ev => { const a = addAnimal('boi', ev.nome); spawnFx(a.x, a.y - 6, 'star', 10); AU.moo(); banner('🐂 ' + a.name, 'ganhou um boi na fazenda!', '#ffe08a', 2.6); },
  vaca: ev => { const a = addAnimal('vaca', ev.nome); spawnFx(a.x, a.y - 6, 'star', 10); AU.moo(); banner('🐄 ' + a.name, 'ganhou uma vaca na fazenda!', '#ffe08a', 2.6); },
  cavalo: ev => { const a = addAnimal('cavalo', ev.nome); spawnFx(a.x, a.y - 6, 'star', 10); AU.hee(); banner('🐎 ' + a.name, 'chegou a cavalo!', '#ffe08a', 2.6); },
  jegue: ev => { const a = addAnimal('jegue', ev.nome); spawnFx(a.x, a.y - 6, 'star', 10); AU.hee(); banner('🫏 ' + a.name, 'ganhou um jegue teimoso!', '#ffe08a', 2.6); },
  galinha: ev => { const a = addAnimal('galinha', ev.nome); spawnFx(a.x, a.y - 4, 'star', 6); AU.tone(900, 700, 0.15, 'square', 0.06); feed('🐔 ' + a.name + ' ganhou uma galinha'); },
  cachorro: ev => { const a = addAnimal('cao', ev.nome); spawnFx(a.x, a.y - 4, 'star', 8); AU.tone(500, 300, 0.12, 'square', 0.08); AU.tone(520, 300, 0.12, 'square', 0.08, 0.18); banner('🐕 ' + a.name, 'ganhou um cachorro vaqueiro!', '#ffe08a', 2.6); },
  bezerro: ev => { const mae = W.animals.filter(a => a.sp === 'boi' && !a.small && !a.bull); const m = pick(mae.length ? mae : [{ x: 135, y: 300 }]); const a = addAnimal('bezerro', ev.nome, { x: cl(m.x + 10, PAST.x0 + 6, PAST.x1 - 6), y: cl(m.y + 4, PAST.y0 + 10, PAST.y1 - 4) }); a.keep = 1; spawnFx(a.x, a.y - 8, 'heart', 14); AU.moo(); banner('🐮 Nasceu ' + a.name + '!', 'Bezerro com o nome de quem mandou o presente', '#ffd0e0', 3.4); },
  aboio: ev => { VQ.act = 'aboio'; VQ.actT = 3.2; VQ.say = 'Êêê boi… ôôô!'; VQ.sayT = 3.2; AU.aboio(); for (const a of W.animals) if (!a.bull && a.sp !== 'galinha') { a.st = 'come'; a.t = 6; } feed('🎶 ' + limpa(ev.nome) + ' pediu um aboio'); },
  laco: ev => { const L = W.animals.filter(a => a.sp === 'boi' && !a.bull); if (!L.length) return; const a = pick(L); VQ.act = 'laco'; VQ.actT = 2.6; VQ.lt = a; VQ.tx = a.x - 30; VQ.ty = a.y; VQ.say = 'Lá vai laço!'; VQ.sayT = 2; AU.tone(400, 1200, 0.5, 'sine', 0.08); feed('🤠 ' + limpa(ev.nome) + ': o vaqueiro laçou ' + a.name); },
  votoChuva: ev => { const t = performance.now() / 1000; W.votos = W.votos.filter(v => t - v.t < 40 && v.u !== ev.user); W.votos.push({ t, u: ev.user }); const need = C.votosParaChover || 5;
    if (W.rain <= 0.05 && W.votos.length >= need) { W.votos = []; ACOES.chuva({ nome: 'a live' }); } else if (W.rain <= 0.05) feed('🌧 ' + limpa(ev.nome) + ' quer chuva (' + W.votos.length + '/' + need + ')'); },
  chuva: ev => { W.rainT = 45; W.rainbow = 0; AU.boom(); banner('🌧 CHOVEU NO SERTÃO!', 'Presente de ' + limpa(ev.nome), '#bfe4ff', 3.6); },
  fogueira: ev => { W.fogo = 120; AU.noise(0.8, 0.1, 900); feed('🔥 ' + limpa(ev.nome) + ' acendeu a fogueira'); },
  forro: ev => { W.forro = 14; banner('🪗 FORRÓ NA FAZENDA!', 'Pedido de ' + limpa(ev.nome), '#ffe08a', 2.8); },
  festa: ev => fila({ k: 'festa', nome: ev.nome }),
  caminhao: ev => fila({ k: 'caminhao', nome: ev.nome, n: ev.n || 3 }),
  barbatao: ev => fila({ k: 'barbatao', nome: ev.nome }),
  vaquejada: ev => fila({ k: 'vaquejada', nome: ev.nome }),
  corrida: ev => fila({ k: 'corrida', nome: ev.nome }),
  aposta1: ev => aposta(ev, 0), aposta2: ev => aposta(ev, 1), aposta3: ev => aposta(ev, 2),
  noite: () => { W.day = (W.day + 0.25) % 1; }
};
function fila(e) { if (W.queue.length >= 8) return; W.queue.push(e); }
function aposta(ev, i) { const R = W.corr; if (!R || R.ph !== 'vote') return; if (R.bets[ev.user] !== undefined) return; R.bets[ev.user] = i; R.names[ev.user] = limpa(ev.nome); R.cnt[i]++; }
// ---------- entrada de eventos (servidor, simulador e teclado) ----------
function evento(ev) {
  if (!ev || !ev.tipo) return; ev.user = ev.user || ev.nome || 'live'; ev.nome = ev.nome || ev.user;
  if (ev.tipo === 'status') { W.live = { conectado: !!ev.conectado, usuario: ev.usuario || '' }; return; }
  if (ev.tipo === 'acao') { const f = ACOES[ev.acao]; if (f) { f(ev); pontos(ev, 2); } return; }
  if (ev.tipo === 'chat') {
    let w = String(ev.texto || '').trim().toLowerCase().replace(/^!/, '').split(/\s+/)[0] || ''; w = (C.apelidos || {})[w] || w; const cmd = (C.comandos || {})[w]; if (!cmd) return;
    const key = ev.user + '|' + w, now = performance.now() / 1000; if (cmd.espera && W.cool[key] && now - W.cool[key] < cmd.espera) return; W.cool[key] = now;
    const f = ACOES[cmd.acao]; if (f) { f(ev); pontos(ev, 1); } return; }
  if (ev.tipo === 'gift') { const d = (+ev.diamantes || 1) * (+ev.qtd || 1); pontos(ev, d * 10); AU.coin(); const L = (C.presentes || []).slice().sort((a, b) => b.min - a.min), p = L.find(x => (+ev.diamantes || 1) >= x.min) || L[L.length - 1];
    feed('🎁 ' + limpa(ev.nome) + ' mandou ' + (ev.qtd > 1 ? ev.qtd + 'x ' : '') + (ev.presente || 'presente'));
    if (p) { const reps = p.acao === 'bezerro' ? Math.min(5, +ev.qtd || 1) : 1; for (let i = 0; i < reps; i++) setTimeout(() => ACOES[p.acao] && ACOES[p.acao](Object.assign({}, ev, { n: Math.min(8, 2 + Math.floor(d / 30)) })), i * 700); } return; }
  if (ev.tipo === 'like') { const n = +ev.curtidas || 1; W.likes += n; pontos(ev, n * 0.1); if (W.likes >= W.likeGoal) { W.likes = 0; W.likeGoal = Math.round(W.likeGoal * 1.15); fila({ k: 'festa', nome: 'as curtidas da live' }); } return; }
  if (ev.tipo === 'follow') { pontos(ev, 20); spawnFx(VQ.x, VQ.y - 20, 'conf', 30); AU.coin(); banner('➕ ' + limpa(ev.nome), 'agora é vaqueiro da fazenda!', '#c8ffb0', 3); return; }
  if (ev.tipo === 'share') { pontos(ev, 15); feed('🔁 ' + limpa(ev.nome) + ' espalhou a notícia'); if (Math.random() < 0.35) fila({ k: 'caminhao', nome: ev.nome, n: 2 }); return; }
  if (ev.tipo === 'join') { feed('👋 ' + limpa(ev.nome) + ' chegou na fazenda'); return; }
}
window.FAZENDA = { evento, W, ACOES };
// ---------- eventos grandes (um por vez) ----------
function bigStart(e) {
  W.big = e; e.t = 0; const nm = limpa(e.nome);
  if (e.k === 'festa') { e.dur = 32; banner('🎉 SÃO JOÃO NA FAZENDA!', 'Graças a ' + nm, '#ffe08a', 4.5); W.fogo = Math.max(W.fogo, 60); AU.cheer(); }
  if (e.k === 'caminhao') { e.dur = 16; W.truck = { x: 300, y: 172, ph: 'in', n: e.n || 3, dropped: 0, nome: nm, t: 0 }; AU.horn(); banner('🚚 CHEGOU A BOIADA!', e.n + ' bois presentes de ' + nm, '#ffe08a', 3.6); }
  if (e.k === 'barbatao') { e.dur = 18; W.bull = addAnimal('boi', 'Barbatão de ' + nm, { x: 250, y: 300 }); W.bull.bull = 1; W.bull.keep = 1; W.bull.br = ['Barbatão', '#1c1816', '#0e0c0a']; VQ.horse = true; AU.boom(); banner('🐂 O BARBATÃO INVADIU!', 'Boi bravo trazido por ' + nm, '#ff9a7a', 4); }
  if (e.k === 'vaquejada') { e.dur = 26; W.vaq = { run: 0, ph: 'ready', t: 0, nome: nm, x: 40 }; VQ.horse = true; AU.cheer(); banner('🏆 GRANDE VAQUEJADA!', 'Oferecida por ' + nm, '#ffe08a', 4.5); }
  if (e.k === 'corrida') { e.dur = 40; W.corr = { ph: 'vote', t: 0, bets: {}, names: {}, cnt: [0, 0, 0], x: [0, 0, 0], v: [0, 0, 0], stall: [0, 0, 0], win: -1, nm: ['Trovão', 'Faísca', 'Teimoso'] }; banner('🫏 CORRIDA DE JEGUE!', 'Comente 1, 2 ou 3 para apostar', '#ffe08a', 4); AU.horn(); }
}
function bigEnd() { const e = W.big; W.big = null; if (e.k === 'barbatao' && W.bull) { W.bull.bull = 0; W.bull.st = 'idle'; W.bull = null; VQ.horse = false; } if (e.k === 'vaquejada') { W.vaq = null; VQ.horse = false; } if (e.k === 'caminhao') W.truck = null; if (e.k === 'corrida') W.corr = null; }
// ---------- atualização ----------
let last = performance.now(), T = 0;
function step(dt) {
  T += dt; W.day = (W.day + dt / ((C.minutosPorDia || 12) * 60)) % 1;
  // chuva e capim

  else { W.rain = lerp(W.rain, 0, dt * 0.5); W.grass = Math.max(0.25, W.grass - dt * 0.0012); }
  W.flash = Math.max(0, W.flash - dt * 3); W.rainbow = Math.max(0, W.rainbow - dt); W.fogo = Math.max(0, W.fogo - dt); W.forro = Math.max(0, W.forro - dt);
  // fila de eventos grandes
  if (!W.big && W.queue.length) bigStart(W.queue.shift());
