# Gera o APK Android do Lida no Sertão a cada envio, sem precisar de computador.
# O APK roda o jogo HTML completo (web/index.html) num app Android leve (android-app/),
# offline, com músicas, fonte e salvamento. Sai como Release do GitHub (link direto) e artefato.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**", "production/**", ".claude/**", "design/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir o jogo (sintaxe do JavaScript)
        run: |
          python3 - <<'EOF'
          s = open('web/index.html', encoding='utf-8').read()
          a = s.index('<script>') + 8; b = s.rindex('</script>')
          open('/tmp/jogo.js', 'w', encoding='utf-8').write(s[a:b])
          EOF
          node --check /tmp/jogo.js

      - name: Preparar o jogo para rodar offline
        run: bash tools/android/prepare_web.sh

      - name: Gerar o APK
        env:
          APP_VERSION_CODE: ${{ 100 + github.run_number }}
          APP_VERSION_NAME: 3.3.${{ github.run_number }}
        run: |
          gradle -p android-app assembleRelease --no-daemon
          mkdir -p build/android
          cp android-app/app/build/outputs/apk/release/app-release.apk build/android/LidaNoSertao.apk
          ls -la build/android
          test -s build/android/LidaNoSertao.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LidaNoSertao-apk
          path: build/android/LidaNoSertao.apk

      - name: Publicar como Release (download direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" build/android/LidaNoSertao.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Lida no Sertão — APK de teste #${{ github.run_number }}" \
            --notes "Jogo completo (HTML) dentro do app Android, gerado de ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Baixe LidaNoSertao.apk no celular e instale (permita instalar de fontes desconhecidas)."
