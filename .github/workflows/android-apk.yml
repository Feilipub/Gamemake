# Gera o APK Android do Lida no Sertão a cada envio, sem precisar de computador.
# O APK sai como um Release do GitHub (link direto para baixar e instalar no celular)
# e também como artefato da execução.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**", "production/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot e modelos de exportação
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "templates/android_debug.apk" "templates/android_release.apk" \
            "templates/android_source.zip" "templates/version.txt" -d "$dest"
          rm -f ./*.tpz ./*.zip
          godot --version

      - name: Configurar Android SDK e chave de depuração
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK em $SDK"
          ls "$SDK/build-tools" | tail -3
          # chave de teste FIXA (versionada): cada APK novo instala por cima do anterior e mantém o save.
          # Só para testes; para a Play Store use uma chave de release guardada em segredo.
          cp tools/android/debug.keystore "$HOME/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar o projeto
        run: godot --headless --path . --import || true

      - name: Testes
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: Exportar APK
        run: |
          set -e
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/LidaNoSertao.apk
          ls -la build/android
          test -s build/android/LidaNoSertao.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LidaNoSertao-apk
          path: build/android/LidaNoSertao.apk

      - name: Publicar como Release (download direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" build/android/LidaNoSertao.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Lida no Sertão — APK de teste #${{ github.run_number }}" \
            --notes "APK de teste gerado automaticamente a partir de ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Baixe LidaNoSertao.apk no celular e instale (permita instalar de fontes desconhecidas)."
