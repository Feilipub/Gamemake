# Gera o APK Android da versão MonoGame do Lida no Sertão (migração em fases, em paralelo ao APK web).
# 1) exporta a arte e o mapa do jogo web (tools/asset-pipeline/export_monogame.js) com o Chromium;
# 2) compila o projeto monogame/Android com .NET 8; 3) publica como Release "mono-apk-N".
name: MonoGame APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "monogame/**"
      - "web/index.html"
      - "tools/asset-pipeline/export_monogame.js"
      - ".github/workflows/monogame-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Exportar arte e mapa do jogo web
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules node tools/asset-pipeline/export_monogame.js web/index.html monogame/Shared/Assets
          ls -la monogame/Shared/Assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # monogame/global.json fixa o .NET 8 (o runner traz o .NET 10, que recusa net8.0-android)
      - name: Instalar o suporte a Android do .NET
        working-directory: monogame
        run: dotnet --version && dotnet workload install android

      - name: Conferir a versão de computador (compila)
        working-directory: monogame
        run: dotnet build Desktop/LidaNoSertao.Desktop.csproj -c Release

      - name: Gerar o APK
        run: |
          cd monogame
          dotnet publish Android/LidaNoSertao.Android.csproj -c Release -f net8.0-android -p:CheckEolWorkloads=false \
            -p:ApplicationVersion=${{ github.run_number }} -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
          cd ..
          mkdir -p build/mono
          apk=$(find monogame/Android/bin/Release -name '*-Signed.apk' | head -1)
          echo "APK: $apk"
          cp "$apk" build/mono/LidaNoSertao-MonoGame.apk
          ls -la build/mono
          test -s build/mono/LidaNoSertao-MonoGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LidaNoSertao-MonoGame-apk
          path: build/mono/LidaNoSertao-MonoGame.apk

      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mono-apk-${{ github.run_number }}"
          gh release create "$tag" build/mono/LidaNoSertao-MonoGame.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Lida no Sertão (MonoGame) — teste #${{ github.run_number }}" \
            --notes "Versão MonoGame (a engine do Stardew Valley), fase 1 da migração: mapa, arte, vaqueiro, gado, dia e noite, porteiras, HUD e salvamento. Instala ao lado do APK web (app separado). Gerado de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
