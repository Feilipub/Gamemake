<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f140e">
<title>Lida no Sertão — Itarantim, Bahia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f140e;--fg:#fce8c5;--ink:#110905;--gold:#fbc653;--leather:#7c4424;--paper:#e9cf98;--paper2:#f6e2b0;--frame:none;--wood:none;--btn:none;--btnp:none;--ctl:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0604;color:var(--fg);font-family:'Pixelify Sans',ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
img.ic{image-rendering:pixelated;vertical-align:middle;pointer-events:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#110905;color:var(--gold);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px;flex-direction:column;gap:14px}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){#rot{display:flex}}
#app{width:min(100vw,calc(100vh*0.5625));height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--leather),0 0 60px #000;background:var(--bg)}
@media (min-width:900px) and (min-height:640px){#app{width:min(100vw,calc(100vh*0.66))}}
/* molduras pixel (geradas em JS) */
.px{border:12px solid #7c4424;border-image:var(--frame) 6 fill / 12px stretch;image-rendering:pixelated;background:transparent}
.wd{border:9px solid #4a2a14;border-image:var(--wood) 6 fill / 9px stretch;image-rendering:pixelated}
/* HUD */
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 6px;align-items:center;padding:5px 6px 6px;padding-top:max(5px,env(safe-area-inset-top));background:linear-gradient(#53301a,#361d0e);border-bottom:4px solid var(--ink);box-shadow:inset 0 -3px 0 #7e4624;font-weight:600;font-size:12px;color:var(--gold);text-shadow:1px 1px 0 var(--ink);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(17,9,5,.55);border:2px solid #2a1608;box-shadow:inset 0 1px 0 rgba(255,220,150,.12);padding:1px 6px 1px 3px;min-height:20px}
#hud .r{justify-self:end}#hud .c{justify-self:center}
@media (max-width:400px){#hud .wt{display:none}#hud{font-size:11.5px}}
.hb{display:inline-block;width:46px;height:8px;border:2px solid var(--ink);background:#2a160b;position:relative;overflow:hidden}
.hb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b8f080,#4fa030);transition:width .3s}
.hb.f i{background:linear-gradient(#ffd27a,#d98a2c)}
#wrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#c{display:block;width:100%;height:100%;touch-action:none}
#msg{position:absolute;left:8px;right:8px;top:8px;padding:6px 10px;background:rgba(20,10,5,.94);color:#fbe9c2;font-size:13px;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;border:3px solid var(--leather);box-shadow:0 0 0 2px var(--ink);z-index:10}
#msg.on{opacity:1;transform:none}
#reg{position:absolute;left:50%;top:22%;transform:translate(-50%,-8px);z-index:9;pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;text-align:center;color:#ffe9b0;text-shadow:2px 2px 0 #1d1109;font-size:19px;font-weight:700;padding:6px 18px;white-space:nowrap}
#reg small{display:block;font-size:11px;color:#e8c890;letter-spacing:2px}
#reg.on{opacity:1;transform:translate(-50%,0)}
/* controles */
#joy{position:absolute;left:10px;bottom:10px;width:calc(104px*var(--ctl));height:calc(104px*var(--ctl));border-radius:50%;background:radial-gradient(circle,rgba(60,35,20,.7) 0%,rgba(20,10,5,.88) 100%);border:3px solid var(--gold);box-shadow:inset 0 0 10px rgba(0,0,0,.8),0 4px 10px rgba(0,0,0,.5);touch-action:none;z-index:5;opacity:.86}
#knob{position:absolute;left:calc(50% - 21px);top:calc(50% - 21px);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe9c2,#d97724 70%,#6e330a);border:2px solid var(--ink);box-shadow:0 4px 6px rgba(0,0,0,.6);pointer-events:none}
.pad{position:absolute;right:6px;bottom:8px;display:grid;grid-template-columns:repeat(2,calc(64px*var(--ctl)));gap:5px;z-index:5;opacity:.94}
button{font-family:inherit;cursor:pointer}
.btn,#bar button,.pad button,#tm button,.tabs button,.cl,#inp button,.ch button,.mb button,#ap button,#setup button{border:3px solid var(--ink);border-radius:0;background:linear-gradient(#f0a84a 0 50%,#d98a2c 50%);color:#2b1608;font-weight:700;text-shadow:0 1px 0 rgba(255,235,170,.7);box-shadow:inset 0 3px 0 rgba(255,244,190,.7),inset 0 -3px 0 rgba(120,56,10,.55),0 4px 0 var(--ink);letter-spacing:.3px;font-size:13px;padding:7px 9px;transition:filter .1s}
.btn:active,#bar button:active,.pad button:active,#tm button:active,.tabs button:active,.cl:active,#inp button:active,.ch button:active,.mb button:active,#ap button:active,#setup button:active{background:linear-gradient(#d98a2c 0 50%,#c0741c 50%);box-shadow:inset 0 3px 0 rgba(120,56,10,.5),0 1px 0 var(--ink);transform:translateY(3px)}
button:disabled{opacity:.45;filter:grayscale(.7)}
.pad button{height:calc(36px*var(--ctl));padding:2px;font-size:11.5px;background:linear-gradient(#b9622a 0 50%,#9a4a1a 50%);color:#fbe9c2;text-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:3px}
.pad button.on{background:linear-gradient(#e8c050 0 50%,#c89a20 50%);color:#2b1608;text-shadow:none}
.pad #bx{grid-column:1 / span 2;height:calc(40px*var(--ctl));background:linear-gradient(#ffe08a 0 50%,#f0b440 50%);color:#2b1608;text-shadow:0 1px 0 #fff3c0;font-size:12.5px;overflow:hidden;white-space:nowrap}
.pad #bx.off{opacity:.42}
#bar{display:flex;gap:6px;padding:6px;background:linear-gradient(#4a2c18,#2a160b);border-top:4px solid var(--ink);box-shadow:inset 0 3px 0 #7e4624;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#bar button{flex:1;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
/* janelas */
#mn{position:absolute;inset:0;background:rgba(12,5,2,.72);z-index:20;padding:8px;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;backdrop-filter:blur(1px)}
#mn.on{display:block;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mb{color:#2b1608;max-width:540px;margin:0 auto;animation:pop .2s cubic-bezier(.2,1.4,.5,1)}
.mb.px{padding:4px 6px 8px}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:.3}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;gap:8px;margin:0 0 6px;min-height:30px}
.mh h2{flex:1;margin:0;font-size:18px;color:#5a2a0e;text-shadow:0 1px 0 #fff0c4;line-height:1.1}
.xb{width:34px;height:34px;padding:0!important;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.mb h3{margin:10px 0 4px;font-size:15px;color:#6a3410}
.mb p{margin:5px 0;font-size:13px;line-height:1.35}
.card{border:3px solid var(--ink);background:var(--paper2);box-shadow:inset 0 0 0 2px #fff0c4,0 3px 0 rgba(29,17,9,.45);color:#2b1608;padding:7px 8px;margin:7px 0;font-size:13px}
.card.sel{background:#fff4c8;outline:3px solid #b8561c}
.card[data-a]{cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}
.sp{justify-content:space-between}
.mut{color:#7a5030;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sl{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border:3px solid var(--ink);background:var(--paper2);box-shadow:inset 0 0 0 2px #fff0c4;cursor:pointer}
.sl b{position:absolute;right:2px;bottom:1px;font-size:11px;background:#b8561c;color:#fff;padding:0 4px}
.sl small{font-size:9px;line-height:1;text-align:center;padding:0 2px}
.cl{width:100%;margin-top:10px;padding:10px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.mgrid button{padding:4px 1px!important;font-size:10px!important;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.05}
.mgrid button.on{background:linear-gradient(#fbe08a 0 50%,#f0c04a 50%)!important;outline:2px solid #fff4c0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs button{flex:0 0 auto;padding:6px 8px;font-size:12px}
.tabs button.on{background:linear-gradient(#fbe08a 0 50%,#f0c04a 50%)}
.bar2{display:inline-block;height:9px;width:84px;border:2px solid var(--ink);background:#5a3a20;vertical-align:middle;position:relative}
.bar2 i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#a8e070,#4f9a30);transition:width .35s}
.bar2.w i{background:linear-gradient(#8fd0ff,#3a88c8)}
.bar2.r i{background:linear-gradient(#ff9a7a,#c8402e)}
.bar2.y i{background:linear-gradient(#ffe08a,#d0a020)}
.stars{color:#d08a10;letter-spacing:1px;text-shadow:0 1px 0 #6a3a00;font-size:15px}
.tag{display:inline-block;background:#7c4424;color:#ffe9c0;font-size:11px;padding:1px 5px;margin:1px;border:2px solid var(--ink)}
.pi{image-rendering:pixelated;vertical-align:middle}
input,select{font:inherit;border:3px solid var(--ink);background:#fff0c4;color:#2b1608;padding:6px}
input[type=range]{width:100%;padding:0;accent-color:#b8561c}
.mb label{display:block;margin-top:4px;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{border-bottom:2px solid #c8a46a;padding:3px 2px;text-align:left}
table.t th{color:#6a3410}
/* painel do animal */
#ap{position:absolute;left:0;right:0;bottom:0;max-height:58%;z-index:16;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.9,.3,1);color:#2b1608;overflow-y:auto;-webkit-overflow-scrolling:touch}
#ap.on{transform:none}
#ap .ah{display:flex;gap:8px;align-items:center;position:sticky;top:-2px;background:var(--paper);z-index:2;padding-bottom:3px}
#ap .ah h2{margin:0;font-size:17px;line-height:1.1}
.sg{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:12px}
.sg .bar2{width:100%}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.ag button{padding:5px 1px!important;font-size:10.5px!important;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.05}
body.sheet .pad,body.sheet #joy{opacity:0;pointer-events:none}
/* título */
#title{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:7% 16px 7%;background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0) 30%,rgba(20,8,2,.55) 100%)}
#tt{text-align:center;animation:drop .9s cubic-bezier(.2,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
#logo{width:min(52vw,180px);display:block;margin:0 auto 2px}
#tt h1{margin:0;font:700 44px/.95 'Pixelify Sans',Georgia,serif;letter-spacing:2px;color:#f9d67a;text-shadow:-3px 0 #371d10,3px 0 #371d10,0 -3px #371d10,0 3px #371d10,0 6px 0 #1d1109,0 12px 18px rgba(0,0,0,.6);background:linear-gradient(100deg,#f9d67a 40%,#fff6d0 50%,#f9d67a 60%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 5s linear infinite}
@supports (-webkit-background-clip:text){#tt h1{color:transparent;text-shadow:none;filter:drop-shadow(3px 0 0 #371d10) drop-shadow(-3px 0 0 #371d10) drop-shadow(0 3px 0 #371d10) drop-shadow(0 -2px 0 #371d10) drop-shadow(0 5px 0 #1d1109)}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
#ts{margin-top:8px;color:#fff0c4;font-weight:700;font-size:13px;letter-spacing:3px;text-shadow:2px 2px 0 #371d10}
#tsub{margin-top:4px;color:#ffe08a;font-size:12px;text-shadow:2px 2px 0 #371d10}
#tm{display:flex;flex-direction:column;gap:9px;width:78%;max-width:270px}
#tm button{padding:10px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;animation:slide .5s both}
#tm button:nth-child(2){animation-delay:.08s}#tm button:nth-child(3){animation-delay:.16s}#tm button:nth-child(4){animation-delay:.24s}#tm button:nth-child(5){animation-delay:.32s}#tm button:nth-child(6){animation-delay:.4s}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
#skip{position:absolute;right:10px;top:10px;z-index:26;padding:7px 12px;display:none}
#sub{position:absolute;left:5%;right:5%;bottom:9%;z-index:25;text-align:center;color:#fff0c4;font:700 15px 'Pixelify Sans',Georgia,serif;background:rgba(20,10,5,.9);border:3px solid var(--leather);padding:8px 12px;text-shadow:0 2px 0 var(--ink);display:none;line-height:1.35}
#sub b{color:var(--gold)}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:24;transition:height .5s}
#lbT{top:0}#lbB{bottom:0}
body.cs .lb{height:9%}
body.cs #joy,body.cs .pad,body.cs #bar button{pointer-events:none}
body.cs #joy,body.cs .pad{opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:23;transition:opacity .5s}
#inp{position:absolute;left:0;right:0;bottom:0;display:none;flex-wrap:wrap;gap:6px;padding:8px;background:rgba(20,10,5,.95);border-top:4px solid var(--ink);z-index:15}
#inp button{flex:1 1 22%;padding:10px 2px;font-size:13px}
#inp .lbl{width:100%;font-size:12px;color:var(--gold)}
body.in .pad,body.in #joy{display:none!important}
body.ttl #hud,body.ttl #bar,body.ttl #joy,body.ttl .pad{display:none!important}
#setup{position:absolute;inset:0;z-index:21;display:none;background:#1f140e;padding:10px 12px 40px;overflow-y:auto}
#setup h2{margin:4px 0;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
#setup label{display:block;font-weight:700;margin:10px 0 3px;color:var(--gold);font-size:13px}
#setup input{width:100%}
#pv{width:100%;height:150px;border:4px solid var(--ink);display:block;background:#6a8a3a}
.ch{display:flex;flex-wrap:wrap;gap:5px}
.ch button{padding:5px 8px;font-size:12px}
.ch button.on{outline:3px solid #fff;background:linear-gradient(#fbe08a 0 50%,#f0c04a 50%)}
.ch button.sw{width:30px;height:28px;padding:0}
.desc{font-size:12px;padding:6px;background:rgba(0,0,0,.35);margin-top:4px;line-height:1.35;border-left:3px solid #d97724}
.hearts{color:#d0302a;font-size:13px;letter-spacing:-1px}
.dlg{display:flex;gap:10px;align-items:flex-start}
.dlg .txt{flex:1;font-size:14px;line-height:1.4;background:#fff4d0;border:3px solid var(--ink);padding:8px;min-height:60px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:44px;z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center;width:92%}
#toast div{background:#2b1608;color:#ffe08a;border:2px solid var(--gold);box-shadow:0 0 0 2px #110905;padding:3px 8px;font-size:12px;animation:tf 2.8s forwards;text-align:center}
@keyframes tf{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
.slot{display:flex;gap:8px;align-items:center}
.slot .info{flex:1}
.credits p{text-align:center}
</style>
</head>
<body class="ttl">
<div id="rot"><div style="font-size:52px">&#x21BB;</div><div>Gire o aparelho: o jogo é jogado na vertical.</div></div>
<div id="app">
 <div id="hud">
  <span class="chip" id="hDayC"><span id="hDay"></span></span>
  <span class="chip c" id="hTimeC"><span id="hTime"></span></span>
  <span class="chip r" id="hWxC"><span id="hWx"></span></span>
  <span class="chip" id="hMoneyC" style="grid-column:1 / span 2"><span id="hMoney"></span></span>
  <span class="r" style="display:flex;gap:6px"><span class="chip" id="hEnC"><span class="hb"><i id="hEn"></i></span></span><span class="chip" id="hFoC"><span class="hb f"><i id="hFo"></i></span></span></span>
 </div>
 <div id="wrap">
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div id="reg" class="wd"></div>
  <div id="toast"></div>
  <div id="title">
   <div id="tt"><canvas id="logo" width="96" height="48"></canvas><h1>LIDA NO<br>SERTÃO</h1><div id="ts">VAQUEIRO · GADO · TRADIÇÃO</div><div id="tsub">Itarantim · Bahia</div></div>
   <div id="tm">
    <button data-t="cont" id="tcont" style="display:none">Continuar</button>
    <button data-t="new">Novo Jogo</button>
    <button data-t="load">Carregar Partida</button>
    <button data-t="opt">Configurações</button>
    <button data-t="how">Como Jogar</button>
    <button data-t="cred">Créditos</button>
   </div>
   <div id="tver" style="font-size:11px;color:#c8a070;text-shadow:1px 1px 0 #000"></div>
  </div>
  <div id="fade"></div>
  <div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
  <button id="skip" class="btn">Pular ▶</button>
  <div id="sub"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="pad">
   <button id="bg">Correr</button>
   <button id="ba">Aboio</button>
   <button id="bl">Laço</button>
   <button id="bm">Montar</button>
   <button id="bx" class="off">Ação</button>
  </div>
  <div id="ap" class="px"></div>
  <div id="inp"></div>
  <div id="mn"><div class="mb px"><div class="mh"><span id="mic"></span><h2 id="mtt"></h2><button class="xb" id="mx" aria-label="Fechar"></button></div><div id="mtabs"></div><div id="mc"></div></div></div>
  <div id="setup"></div>
 </div>
 <div id="bar">
  <button id="bb"><span id="ib1"></span>Mochila</button>
  <button id="br"><span id="ib2"></span>Menu</button>
  <button id="bs"><span id="ib3"></span>Vender</button>
  <button id="bsn" style="flex:0 0 46px"><span id="ib4"></span></button>
 </div>
</div>
<script>
(()=>{
'use strict';
/* ============ NÚCLEO ============ */
const $ = i => document.getElementById(i);
const TS = 16, MW = 112, MH = 90, WPX = MW * TS, HPX = MH * TS;
const GAME_V = '2.1.0', SAVE_V = 4;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cl = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
function H2(x, y, s) { let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 1442695041; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
const fmt = n => (n < 0 ? '-' : '') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const fmt2 = n => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const T2P = t => t * TS;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
const SPR = new Map();
function cached(key, w, h, fn, ol) { let c = SPR.get(key); if (!c && SPR.size > 4000) { for (const k of SPR.keys()) if (k[0] === 'C' || k.startsWith('hr|')) SPR.delete(k); } if (!c) { const r = mkC(w, h); fn(r[1]); if (ol !== false) outline(r[1], w, h); c = r[0]; SPR.set(key, c); } return c; }
function outline(g, w, h) {

const LOANS = {
  pessoal: { n: 'Crédito Pessoal', i: 0.032, d: 'Liberado na hora, sem finalidade definida.' },

const SAV_RATE = 0.0016; // ao dia
function rateFor(kind) { return LOANS[kind].i * (1 + (700 - S.score) / 900); }
function debt() { return S.loans.reduce((s, l) => s + l.bal, 0); }
function herdValue() { return myAnimals().reduce((s, a) => s + animalValue(a), 0); }
function creditLimit() { return Math.max(0, Math.round((8000 + herdValue() * 0.45 + (S.exp.norte ? 20000 : 0) + (S.exp.sul ? 30000 : 0)) * (S.score / 700) - debt())); }
function parcela(P, i, n) { return P * i / (1 - Math.pow(1 + i, -n)); }
function takeLoan(kind, P, n, purpose) {
  P = Math.round(P); const i = rateFor(kind);
  if (P < 500) return 'Valor mínimo: R$ 500.'; if (P > creditLimit()) return 'Valor acima do seu limite de crédito (' + fmt(creditLimit()) + ').';
  if (S.loans.some(l => l.late >= 3)) return 'Crédito bloqueado: há parcelas em atraso.';
  const L = { id: S.nid++, kind, n: LOANS[kind].n, P, i, k: n, paid: 0, parc: Math.round(parcela(P, i, n) * 100) / 100, next: S.day + 7, bal: P, late: 0, day0: S.day, purpose: purpose || '' };
  S.loans.push(L); if (kind !== 'terra' && kind !== 'obra') { S.acct += P; ledger(L.n + ' liberado', P, 'cc'); }
  else ledger(L.n + ' (' + purpose + ')', 0, 'cc');
  remember('lucia', 'contratou ' + L.n.toLowerCase()); return null;
}
function payInstallment(l, manual) {
  const v = l.parc;
  if (S.acct >= v) { S.acct -= v; ledger('Parcela ' + (l.paid + 1) + '/' + l.k + ' — ' + l.n, -v, 'cc'); }
  else if (S.acct + S.cash >= v) { const c = v - Math.max(0, S.acct); if (S.acct > 0) ledger('Parcela ' + (l.paid + 1) + '/' + l.k + ' — ' + l.n, -S.acct, 'cc'); S.acct = Math.min(S.acct, 0); S.cash -= c; ledger('Parcela (dinheiro)', -c, 'cx'); }
  else return false;
  l.bal = Math.max(0, l.bal * (1 + l.i) - v); l.paid++; l.late = 0; l.next = l.day0 + 7 * (l.paid + 1);
  if (l.paid >= l.k || l.bal < 1) { S.loans = S.loans.filter(x => x !== l); S.score = cl(S.score + 25, 300, 950); toast('🎉 ' + l.n + ' quitado!'); addFr('lucia', 30); }
  else S.score = cl(S.score + 3, 300, 950);
  return true;
}
function bankDay() {
  if (S.sav > 0) { const j = Math.round(S.sav * SAV_RATE * 100) / 100; S.sav += j; ledger('Rendimento da poupança', j, 'pp'); }
  if (S.acct < 0) { const j = Math.round(-S.acct * 0.004 * 100) / 100; S.acct -= j; ledger('Juros do cheque especial', -j, 'cc'); }
  for (const l of S.loans.slice()) {
    if (S.day < l.next) continue;
    if (payInstallment(l)) { toast('🏦 Parcela de ' + l.n + ' debitada: ' + fmt2(l.parc)); continue; }
    l.late++; const multa = Math.round(l.parc * 0.02 * 100) / 100; l.bal += multa + l.bal * l.i * 0.15; S.score = cl(S.score - 22, 300, 950); l.next = S.day + 1;
    ledger('Multa por atraso — ' + l.n, -multa, 'cc'); toast('⚠️ Parcela em atraso (' + l.late + ' dia/s). Multa aplicada!'); addFr('lucia', -10);
    if (l.late >= 5) seize(l);

}
function seize(l) {
  let need = l.parc * 2; S.score = cl(S.score - 80, 300, 950);
  if (S.sav > 0) { const t = Math.min(S.sav, need); S.sav -= t; need -= t; ledger('Bloqueio judicial da poupança', -t, 'pp'); }
  const herd = myAnimals().filter(a => !a.main).sort((a, b) => animalValue(b) - animalValue(a));
  while (need > 0 && herd.length) { const a = herd.shift(); need -= animalValue(a) * 0.7; S.animals = S.animals.filter(x => x !== a); toast('⚖️ O banco penhorou ' + a.n + '!'); }
  l.bal = Math.max(0, l.bal - l.parc * 2); l.paid++; l.late = 0; l.next = S.day + 7;

    if ($('setup').style.display !== 'none') drawPreview(dt);
  } catch (err) { console.error(err); }
  if (msgT > 0) { msgT -= dt * 1000; if (msgT <= 0) $('msg').classList.remove('on'); }
  requestAnimationFrame(loop);
}
/* ---------- tela de título ---------- */
const TITLE_PATH = [[84, 44], [86, 52], [72, 44], [60, 44], [40, 40], [20, 52], [10, 30], [30, 26], [62, 44], [84, 44]];
let titleU = 0;
function titleCam(dt) { titleU += dt * 0.012; const [x, y] = pathLerp(TITLE_PATH.map(p => [p[0] * TS, p[1] * TS]), titleU % 1); cam.fx = x; cam.fy = y; cam.spd = 3; S.min = 17.2 * 60; buildGrid(); for (const a of S.animals) updAnimal(a, dt, 0.5 * dt, []); for (const e of npcs) updNpc(e, dt); }
function demoWorld() {
  S = newState(); P = S.p; P.x = -500; P.y = -500; S.cf = { name: '', st: 8, sk: {}, ap: defaultCF().ap, aj: 2 };
  genMap(); initGrass(); S.tr = TROUGHS.map(t => t.cap * 0.6); S.gates = GATES.map(g => g.open ? 1 : 0); S.min = 17 * 60;
  const put = (a, k) => { const p = randIn(k); a.x = p[0]; a.y = p[1]; S.animals.push(a); };
  for (let i = 0; i < 7; i++) put(mkAnimal('boi', pick(['nelore', 'nelore', 'gir', 'guzera']), {}), 'p1');
  for (let i = 0; i < 4; i++) put(mkAnimal('boi', 'nelore', { own: 'felipe' }), 'campos');
  for (let i = 0; i < 3; i++) put(mkAnimal('cavalo', pick(Object.keys(HORSES)), { own: 'ryan' }), 'duarte');
  for (let i = 0; i < 4; i++) put(mkAnimal('galinha', 'caipira', { sex: i ? 'F' : 'M', age: 20 }), 'galin');
  initNpcs(); cam.fx = 84 * TS; cam.fy = 44 * TS; cam.snap = true; cam.uz = 1.15; cam.az = 1; cam.taz = 1;
}
function slotCard(s) {
  if (s.empty) return `<div class="card slot"><span>${ic('plus', 26)}</span><div class="info"><b>Partida ${s.n}</b><br><span class="mut">Vazia</span></div>${btn('Novo jogo', 'slotNew', s.n)}</div>`;
  const dt = new Date(s.ts); return `<div class="card slot"><span>${ic('hat', 26)}</span><div class="info"><b>Partida ${s.n}: ${esc(s.name || '')}</b><br><span class="mut">Dia ${s.day}${s.season ? ' · ' + s.season : ''}${s.money !== undefined ? ' · ' + fmt(s.money) : ''}${s.herd !== undefined ? ' · ' + s.herd + ' cabeças' : ''}<br>Salvo em ${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></div><div class="row" style="flex-direction:column">${btn('Jogar', 'slotLoad', s.n)}${M.del === s.n ? btn('Confirmar', 'slotDelOk', s.n) : btn('Apagar', 'slotDel', s.n)}</div></div>`;
}
async function openSlots(kind) {
  M.slots = null; M.del = null; M.kind = kind;
  showModal(kind === 'new' ? 'Escolha a partida' : 'Carregar partida', null, null, () => M.slots ? (kind === 'new' ? '<p class="mut">Escolha um espaço para o novo jogo. Partidas existentes só são substituídas no primeiro salvamento do novo jogo.</p>' : '') + M.slots.map(slotCard).join('') : '<p>Carregando…</p>', 'disk');
  M.slots = await SAVE.slots(); renderModal();
}
A.slotNew = n => { SAVE.slot = +n; closeModal(); openSetup(false); };
A.slotLoad = n => { closeModal(); SAVE.loadBest(+n).then(ok => { if (!ok) say('Não foi possível carregar essa partida.'); }); };
A.slotDel = n => { M.del = +n; renderModal(); };
A.slotDelOk = async n => { await SAVE.deleteSlot(+n); M.del = null; M.slots = await SAVE.slots(); renderModal(); toast('Partida ' + n + ' apagada'); refreshTitle(); };
async function refreshTitle() { const sl = await SAVE.slots(); const best = sl.filter(s => !s.empty).sort((a, b) => b.ts - a.ts)[0]; const b = $('tcont'); if (best) { b.style.display = 'flex'; b.innerHTML = ic('play', 18) + ' Continuar — ' + esc(best.name || '') + ', dia ' + best.day; } else b.style.display = 'none'; }
$('tm').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return; AU.init(); AU.click(); const t = b.dataset.t;
  if (t === 'new') { const sl = await SAVE.slots(); const free = sl.find(s => s.empty); if (free && sl.every(s => s.empty)) { SAVE.slot = free.n; openSetup(false); } else openSlots('new'); }
  else if (t === 'cont') { const ok = await SAVE.loadBest(); if (!ok) say('Não foi possível carregar o save.'); }
  else if (t === 'load') openSlots('load');
  else if (t === 'opt') showOptions();
  else if (t === 'how') showHelp();
  else if (t === 'cred') showCredits();
};
/* ---------- inicialização ---------- */
(async function init() {
  try { const v = JSON.parse(localStorage.getItem('lida_vol')); if (v) Object.assign(AU.vol, v); } catch (e) { }
  initAssets(); $('tver').textContent = 'v' + GAME_V + ' · Edição Itarantim';
  resize(); demoWorld(); requestAnimationFrame(loop);
  await SAVE.migrateLegacy(); refreshTitle();
  if (location.hash.includes('debug')) window.__lida = { ev: s => eval(s), get S() { return S; }, get P() { return P; }, get mode() { return mode; }, SAVE };
})();


})();
