// App Android do Lida no Sertão: roda o jogo HTML completo (web/) num WebView, offline.
// O CI copia web/index.html, as músicas e a fonte para src/main/assets/www antes do build.
plugins { id "com.android.application" }

android {
    namespace "br.com.rfgames.lidanosertao"
    compileSdk 34
    defaultConfig {
        applicationId "br.com.rfgames.lidanosertao"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "2")
        versionName System.getenv("APP_VERSION_NAME") ?: "3.3.0"
    }
    signingConfigs {
        teste {
            storeFile file("../../tools/android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.teste }
        release { signingConfig signingConfigs.teste; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions { noCompress "mp3" }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
