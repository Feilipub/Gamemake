# Fazenda da Live (pasta live/) no Render: servidor-ponte do TikTok + o jogo, num link https.
# No Render: New + > Blueprint > escolha este repositório. Preencha TIKTOK_USUARIO (seu usuário, sem @).
services:
  - type: web
    name: fazenda-da-live
    runtime: node
    rootDir: live
    plan: free
    buildCommand: npm install
    startCommand: node servidor.mjs
    envVars:
      - key: TIKTOK_USUARIO
        sync: false
      - key: EULER_KEY
        sync: false
